name: Publish research prototype
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Extract and verify fixed materials
        run: |
          unzip -q one-physician-site.zip -d _site
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('_site')
          manifest = json.loads((root / 'deployment-manifest.json').read_text())
          for item in manifest['files']:
              path = root / item['path']
              assert path.is_file(), item['path']
              assert hashlib.sha256(path.read_bytes()).hexdigest() == item['sha256'], item['path']
          print('Verified', len(manifest['files']), 'files')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
